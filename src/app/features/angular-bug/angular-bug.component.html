<div class="shadow" #shadow aria-hidden="true">
  <svg viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="0" cy="6" rx="34" ry="14" fill="#000" />
  </svg>
</div>

<div class="bug" #bug [class.walking]="walking()" aria-hidden="true">
  <svg viewBox="-50 -65 100 130" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="shellGrad" cx="38%" cy="32%" r="80%">
        <stop offset="0%" stop-color="#ff3a5b" />
        <stop offset="55%" stop-color="#dd0031" />
        <stop offset="100%" stop-color="#8a0020" />
      </radialGradient>
      <linearGradient id="seamShade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1a0006" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#1a0006" stop-opacity="0.95" />
      </linearGradient>
      <radialGradient id="headGrad" cx="50%" cy="35%" r="80%">
        <stop offset="0%" stop-color="#3a1014" />
        <stop offset="100%" stop-color="#0a0204" />
      </radialGradient>
    </defs>

    <!-- Antennae (tripod-A side) -->
    <g class="antennae" stroke="#0a0204" stroke-width="1.6" stroke-linecap="round" fill="none">
      <path d="M-7 -42 Q-18 -52 -24 -58" />
      <path d="M7 -42 Q18 -52 24 -58" />
      <circle cx="-24" cy="-58" r="2.2" fill="#0a0204" stroke="none" />
      <circle cx="24" cy="-58" r="2.2" fill="#0a0204" stroke="none" />
    </g>

    <!-- Legs: alternating tripod gait -->
    <!-- Tripod A: front-left, mid-right, back-left -->
    <g class="leg tripod-a" stroke="#0a0204" stroke-width="2.6" stroke-linecap="round" fill="none">
      <!-- front-left: thigh + tibia -->
      <path d="M-22 -22 L-38 -32 L-46 -38" />
      <!-- mid-right -->
      <path d="M22 -2 L42 -2 L52 -6" />
      <!-- back-left -->
      <path d="M-22 18 L-38 30 L-46 38" />
    </g>
    <!-- Tripod B: front-right, mid-left, back-right -->
    <g class="leg tripod-b" stroke="#0a0204" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M22 -22 L38 -32 L46 -38" />
      <path d="M-22 -2 L-42 -2 L-52 -6" />
      <path d="M22 18 L38 30 L46 38" />
    </g>

    <!-- Pronotum (segment behind head) -->
    <path d="M-16 -34 Q0 -38 16 -34 L18 -22 L-18 -22 Z" fill="#0a0204" />

    <!-- Head -->
    <ellipse cx="0" cy="-40" rx="13" ry="10" fill="url(#headGrad)" />
    <!-- Eyes -->
    <ellipse cx="-7" cy="-43" rx="2.4" ry="2.0" fill="#fff" opacity="0.85" />
    <ellipse cx="7" cy="-43" rx="2.4" ry="2.0" fill="#fff" opacity="0.85" />
    <circle cx="-7" cy="-43" r="1.1" fill="#0a0204" />
    <circle cx="7" cy="-43" r="1.1" fill="#0a0204" />

    <!-- Shell (elytra) -->
    <ellipse cx="0" cy="6" rx="34" ry="38" fill="url(#shellGrad)" />

    <!-- Center seam -->
    <path d="M0 -28 L0 42" stroke="url(#seamShade)" stroke-width="2.4" />

    <!-- Spots (asymmetric — real ladybugs have natural asymmetry) -->
    <ellipse cx="-18" cy="-12" rx="4.5" ry="4" fill="#0a0204" />
    <ellipse cx="17" cy="-10" rx="4" ry="3.6" fill="#0a0204" />
    <ellipse cx="-22" cy="10" rx="3.8" ry="3.4" fill="#0a0204" />
    <ellipse cx="20" cy="14" rx="4.2" ry="3.8" fill="#0a0204" />
    <ellipse cx="-10" cy="28" rx="3.2" ry="2.8" fill="#0a0204" />
    <ellipse cx="11" cy="30" rx="3" ry="2.6" fill="#0a0204" />

    <!-- Angular A subtly etched into the shell (low contrast) -->
    <g transform="translate(-10 -2) scale(0.13)" opacity="0.35">
      <path d="M75 25 L25 140 H40 L48 120 H102 L110 140 H125 Z M75 55 L94 105 H56 Z" fill="#fff" />
    </g>

    <!-- Specular highlight -->
    <ellipse cx="-13" cy="-16" rx="11" ry="5" fill="#fff" opacity="0.22" />
    <ellipse cx="-9" cy="-19" rx="4" ry="2" fill="#fff" opacity="0.45" />

    <!-- Lower-rim shadow (gives 3D dome feel) -->
    <ellipse cx="0" cy="36" rx="32" ry="8" fill="#0a0204" opacity="0.35" />
  </svg>
</div>
